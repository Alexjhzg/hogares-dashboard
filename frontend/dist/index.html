<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <title>DashboardSociales — Analytics Dashboard</title>

  <!-- Google Fonts: Outfit (Headings) & Inter (Data/Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Libraries (Chart.js, Lucide, Leaflet, Tabulator) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <script src="./js/lucide.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet">
  <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>

  <!-- Custom Styles -->
  <script type="module" crossorigin src="./assets/index-DK2m2qH0.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BbBA4G8W.css">
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-surface-dark dark:text-slate-300 font-sans min-h-screen flex flex-col transition-colors duration-300">

  <!-- ======= HEADER ======= -->
  <header class="sticky top-0 z-[var(--z-header)] glass-panel border-b-0 px-3 sm:px-6 py-2.5 sm:py-4 flex items-center justify-between shadow-md transition-all">
    <div class="flex items-center gap-2 sm:gap-4 overflow-hidden">
      <div class="h-9 w-9 sm:h-10 sm:w-10 rounded-xl bg-brand-blue/20 text-brand-blue flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.3)] shrink-0">
        <i data-lucide="activity" class="w-5 h-5 sm:w-6 h-6"></i>
      </div>
      <div class="min-w-0">
        <h1 class="text-sm sm:text-lg font-outfit font-black tracking-tight text-slate-800 dark:text-white flex items-center gap-1.5">
          <span class="truncate">DashboardSociales</span>
          <span class="hidden sm:inline-block bg-brand-blue/20 text-brand-blue text-[9px] px-1.5 py-0.5 rounded-md uppercase tracking-widest font-bold">SEEM</span>
        </h1>
        <p class="text-[9px] sm:text-[10px] text-slate-400 font-medium uppercase tracking-widest font-inter hidden sm:block">ESCA/EHM</p>
      </div>
    </div>

    <div class="flex items-center gap-1.5 sm:gap-3">
      <div id="statusIndicator" class="hidden lg:flex items-center gap-2 mr-1">
        <span class="relative flex h-2 w-2" id="connectionPingContainer">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-emerald opacity-75" id="connectionPing"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-brand-emerald" id="connectionDot"></span>
        </span>
        <span id="connectionStatus" class="transition-colors text-[10px] text-brand-emerald font-bold font-inter uppercase tracking-tighter">Live Connection</span>
      </div>

      <select id="assetSelect" class="bg-white dark:bg-slate-800/50 border border-slate-300 dark:border-slate-700 rounded-xl px-2 sm:px-4 py-1.5 text-[11px] sm:text-sm text-slate-700 dark:text-slate-200 focus:outline-none focus:border-brand-blue/50 transition-all cursor-pointer font-inter appearance-none pr-7 sm:pr-10 relative max-w-[110px] sm:max-w-none">
        <option value="">— Cargar Encuesta —</option>
      </select>

      <div class="h-5 w-px bg-slate-200 dark:bg-slate-700 hidden sm:block mx-1"></div>

      <div class="flex items-center gap-1">
        <button id="btnThemeToggle" class="w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-500 hover:text-brand-blue dark:hover:text-white transition-all active:scale-95">
          <i data-lucide="moon" class="w-4 h-4" id="iconMoon"></i>
          <i data-lucide="sun" class="w-4 h-4" id="iconSun"></i>
        </button>
        <button id="btnRefresh" title="Sincronizar con Kobo" class="group w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center bg-slate-100 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-500 hover:text-brand-blue transition-all active:scale-95">
          <i data-lucide="refresh-cw" class="w-4 h-4 group-hover:rotate-180 transition-transform"></i>
        </button>
      </div>
      <div id="statusBadge" class="hidden">Conectando...</div>
    </div>
  </header>

  <!-- ======= MAIN CONTENT (Shell) ======= -->
  <main id="mainContent" class="flex-1 overflow-y-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-8 flex flex-col gap-4 hidden max-w-[1800px] mx-auto w-full">
    
    <!-- Permanent Navigation Shell -->
    <section class="glass-panel rounded-xl p-3 md:p-4 flex flex-col lg:flex-row gap-4 items-stretch lg:items-end justify-between overflow-visible z-10">
      <div class="flex flex-col sm:flex-row gap-4 flex-1 flex-wrap">
        <div class="flex-1 min-w-[240px] lg:max-w-xs">
          <label class="block text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-2 ml-1">Encuestador</label>
          <div class="relative">
            <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 dark:text-slate-500 pointer-events-none"></i>
            <select id="filterEncuestador" class="w-full bg-white dark:bg-surface-dark/80 border border-slate-300 dark:border-slate-700/80 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-700 dark:text-slate-200 focus:border-brand-blue/50 focus:ring-1 outline-none transition-all appearance-none cursor-pointer">
              <option value="">Todos los encuestadores</option>
            </select>
          </div>
        </div>
        <div class="flex-1 min-w-[280px] lg:max-w-sm">
          <label class="block text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-2 ml-1">Periodo</label>
          <div class="flex items-center gap-2 bg-white dark:bg-surface-dark/80 border border-slate-300 dark:border-slate-700 rounded-xl p-1 focus-within:border-brand-blue/50 transition-all">
            <input type="date" id="filterFechaInicio" class="flex-1 min-w-0 bg-transparent text-slate-700 dark:text-slate-300 px-2 py-1.5 text-xs sm:text-sm outline-none" />
            <span class="text-slate-400 font-black text-[10px] px-1">→</span>
            <input type="date" id="filterFechaFin" class="flex-1 min-w-0 bg-transparent text-slate-700 dark:text-slate-300 px-2 py-1.5 text-xs sm:text-sm outline-none" />
          </div>
        </div>
      </div>

      <div class="flex-none grid grid-cols-2 lg:flex lg:flex-row items-center gap-2 md:gap-3 w-full lg:w-auto">
        <div id="activeFiltersContainer" class="hidden lg:flex flex-wrap items-center gap-2 max-w-xs overflow-hidden h-[36px] justify-end"></div>
        <button id="filterINE" class="flex items-center justify-center gap-2 px-3 py-2.5 bg-white dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-500 hover:text-brand-emerald transition-all text-xs font-bold whitespace-nowrap group w-full lg:w-auto">
          <i data-lucide="chart-column-increasing" class="w-4 h-4"></i><span>Solo INE</span>
        </button>
        <button id="filterSEGEN" class="flex items-center justify-center gap-2 px-3 py-2.5 bg-white dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-500 hover:text-brand-purple transition-all text-xs font-bold whitespace-nowrap group w-full lg:w-auto">
          <i data-lucide="map-pinned" class="w-4 h-4"></i><span>Solo SEGEN</span>
        </button>
        <button id="btnReset" class="flex items-center justify-center gap-2 px-3 py-2.5 bg-white dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-500 hover:text-brand-orange transition-all text-xs font-bold whitespace-nowrap group w-full lg:w-auto" title="Limpiar"><i data-lucide="brush-cleaning" class="w-4 h-4 group-hover:-rotate-12 transition-transform"></i><span>Limpiar</span></button>
        <button id="btnOpenFilters" class="flex items-center justify-center gap-2 btn-primary relative w-full lg:w-auto"><i data-lucide="sliders-horizontal" class="w-4 h-4"></i><span>Filtros</span><span id="activeFiltersBadge" class="hidden absolute -top-2 -right-2 bg-brand-orange text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-surface-dark animate-pulse">0</span></button>
      </div>
    </section>

    <!-- Tabbed Navigation -->
    <div class="flex items-center justify-center lg:justify-start w-full">
      <nav id="mainTabs" class="flex items-center gap-1 p-1.5 bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-white/5 rounded-[22px] backdrop-blur-md shadow-sm relative z-10 w-full lg:w-fit overflow-x-auto no-scrollbar">
        <button data-tab="tab-resumen" class="tab-btn active"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span class="hidden sm:inline">Vista General</span></button>
        <button data-tab="tab-mapa" class="tab-btn"><i data-lucide="map" class="w-4 h-4"></i><span class="hidden sm:inline">Cobertura y Datos</span></button>
        <button data-tab="tab-ranking" class="tab-btn"><i data-lucide="bar-chart-2" class="w-4 h-4"></i><span class="hidden sm:inline">Desempeño</span></button>
        <button data-tab="tab-mm111" class="tab-btn"><i data-lucide="clipboard-list" class="w-4 h-4"></i><span class="hidden sm:inline">MM-111</span></button>
        <button data-tab="tab-inconsistencias" class="tab-btn"><i data-lucide="shield-alert" class="w-4 h-4"></i><span class="hidden sm:inline">Inconsistencias</span></button>
      </nav>
    </div>

    <!-- Components will be injected here by layout.js -->

  </main>

  <footer class="border-t border-slate-200 dark:border-slate-800/50 bg-slate-50 dark:bg-surface-dark px-6 py-4 mt-auto">
    <div class="max-w-[1600px] mx-auto flex flex-col sm:flex-row items-center justify-between gap- 2 text-[10px] text-slate-500">
      <span>DashboardSociales — ESCA/EHM &copy; 2026</span>
      <span class="text-slate-600">Powered by KoboToolbox + FastAPI</span>
    </div>
  </footer>

</body>
</html>
